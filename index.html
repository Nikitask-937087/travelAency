<style>
:root{--wine:#8e3437;--wine2:#a34443;--orange:#f58b3e;--cream:#faf7f2;--paper:#fff;--ink:#302b2a;--muted:#827b76;--line:#eee8e1;--sage:#e8f3eb;--green:#397b5d;--gold:#e6b66c}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-family:'Playfair Display';font-size:25px;color:var(--wine);letter-spacing:-1px;border:1px solid #e8d6c5;padding:4px 12px}.brand small{font-family:'DM Sans';display:block;font-size:7px;letter-spacing:1.5px;text-align:center;color:#9a7665}.user-menu{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:#ffd0b0;color:var(--wine);display:grid;place-items:center;font-weight:700;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:28px 16px;flex-shrink:0;display:flex;flex-direction:column}.side-label{font-size:10px;letter-spacing:1px;color:#8d8580;font-weight:700;margin:0 10px 18px}.navlink{display:flex;align-items:center;gap:13px;color:#716b67;text-decoration:none;padding:13px 14px;border-radius:9px;margin:2px 0;cursor:pointer}.navlink:hover,.navlink.active{background:var(--orange);color:#442b20;font-weight:700}.navlink i{font-size:16px}.side-note{background:#faf5ef;border-radius:14px;padding:17px;margin-top:24px;color:var(--wine)}.side-note strong{display:block;font-family:'Playfair Display';font-size:16px;margin:8px 0}.side-note p{font-size:11px;color:#827b76;margin:0}.main{flex:1;min-width:0;padding:34px clamp(18px,3vw,48px) 48px;max-width:1600px;margin:0 auto;width:100%}.eyebrow{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--wine);font-weight:700;margin-bottom:8px}.page-title{font-family:'Playfair Display',serif;color:var(--wine);font-size:clamp(28px,3vw,39px);font-weight:700;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:24px}.cardx{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 3px 14px #60452a08}.cardx h5,.section-title{font-family:'Playfair Display';color:var(--wine);font-size:19px;font-weight:700;margin:0 0 17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat .cap{color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--wine);font-size:27px;margin:6px 0 3px}.stat small{color:var(--muted);font-size:11px}.hero{display:grid;grid-template-columns:.9fr 1.3fr;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin:20px 0}.hero-copy{padding:30px;display:flex;flex-direction:column;justify-content:center}.hero h2{font:700 32px 'Playfair Display';color:var(--wine);margin:12px 0}.hero img{width:100%;height:100%;min-height:260px;object-fit:cover}.btn-trip{background:var(--orange);border:1px solid var(--orange);color:#38271e;border-radius:9px;padding:10px 16px;font-weight:700}.btn-trip:hover{background:#e97b2d;color:#fff}.btn-outline-trip{background:#fff;border:1px solid var(--line);color:var(--wine);border-radius:9px;padding:9px 15px;font-weight:600}.btn-outline-trip:hover{border-color:var(--wine);color:var(--wine)}.btn-link-trip{border:0;background:none;color:var(--wine);font-weight:700;text-decoration:none;padding:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.gridwide{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.muted{color:var(--muted)}.tiny{font-size:11px}.pill{display:inline-flex;padding:5px 10px;border-radius:30px;background:var(--sage);color:var(--green);font-size:11px;font-weight:700}.pill.warn{background:#fff1d9;color:#94631b}.pill.red{background:#fbe9e7;color:#a34d48}.table-wrap{overflow-x:auto}.table{min-width:850px;vertical-align:middle}.table thead th{background:#faf7f2;color:#746b65;font-size:11px;font-weight:700;border:0;padding:13px 12px}.table tbody td{padding:17px 12px;border-color:var(--line);font-size:12px}.table tbody tr:last-child td{border-bottom:0}.form-control,.form-select{border-color:#e8e1db;border-radius:9px;padding:11px 12px;font-size:13px}.form-control:focus,.form-select:focus{border-color:#d68a5a;box-shadow:0 0 0 .2rem #f58b3e22}.form-label{font-size:12px;font-weight:700;color:#554b46}.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filterbar .form-control,.filterbar .form-select{max-width:230px}.booking-cover{height:230px;width:100%;object-fit:cover;border-radius:13px}.detail-hero{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.info-pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info-pair small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.info-pair strong{font-size:13px}.amount{font:700 27px 'Playfair Display';color:var(--wine)}.alert-soft{background:#fff3d9;border:0;color:#795a2b;border-radius:10px;padding:15px}.alert-success-soft{background:#eaf5ee;color:#397b5d;border:0;border-radius:10px;padding:15px}.timeline{border-left:2px solid #e8e2db;margin-left:10px;padding-left:22px}.step{position:relative;padding:0 0 22px}.step:before{content:'';position:absolute;left:-30px;top:2px;width:15px;height:15px;border-radius:50%;background:#e6f2e9;border:3px solid #78a98a}.step.pending:before{background:#fff1d9;border-color:#e7b66d}.profile-banner{height:155px;border-radius:15px;object-fit:cover;width:100%}.profile-head{display:flex;align-items:center;gap:18px;padding:0 20px 18px}.profile-head .avatar{width:72px;height:72px;font-size:23px;border:4px solid #fff;margin-top:-30px}.field-value{font-weight:600;margin-top:4px}.field-block{margin-bottom:18px}.modal-content{border:0;border-radius:18px;padding:8px}.modal-header,.modal-footer{border:0}.modal-title{font-family:'Playfair Display';color:var(--wine);font-weight:700}.toast-container{z-index:2000}.rating button{border:0;background:none;color:#d8d0c8;font-size:27px;padding:0 2px}.rating button.selected{color:#e7ad55}.empty{text-align:center;padding:70px 20px}.empty i{font-size:36px;color:#c48b67}.login-wrap{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 68px);background:#fff}.login-photo{position:relative;min-height:600px;background:linear-gradient(0deg,#16251dcc,transparent 70%),url('https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=1400&q=85') center/cover}.login-photo .quote{position:absolute;bottom:50px;left:45px;color:white;max-width:560px}.login-photo h2{font:700 42px 'Playfair Display'}.login-form{display:flex;align-items:center;justify-content:center;padding:40px}.login-form-inner{width:min(440px,100%)}.mobile-menu{display:none}.footer-note{text-align:center;color:#9a918a;font-size:11px;padding:26px 0}.hide{display:none!important}
@media(max-width:1050px){.sidebar{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.gridwide{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.topbar{height:60px;padding:0 14px}.brand{font-size:21px}.mobile-menu{display:inline-flex}.layout{display:block}.sidebar{display:none;position:fixed;z-index:30;top:60px;bottom:0;left:0;width:270px;box-shadow:10px 0 30px #0002}.sidebar.open{display:flex}.main{padding:24px 14px 35px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.hero{grid-template-columns:1fr}.hero img{min-height:190px;max-height:230px;grid-row:1}.hero-copy{padding:22px}.hero h2{font-size:27px}.grid2,.detail-grid{grid-template-columns:1fr}.cardx{padding:17px}.filterbar>*{max-width:none!important;flex:1 1 100%}.filterbar .form-control,.filterbar .form-select{width:100%}.profile-head{align-items:flex-start;flex-wrap:wrap}.login-wrap{grid-template-columns:1fr}.login-photo{min-height:270px}.login-photo .quote{left:22px;bottom:22px}.login-photo h2{font-size:30px}.login-form{padding:30px 20px}.page-title{font-size:29px}}
@media(max-width:390px){.stats{grid-template-columns:1fr}.user-name{display:none}.info-pair{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="topbar">
 <div class="d-flex align-items-center gap-3"><button class="btn btn-sm btn-outline-secondary mobile-menu" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button><div class="brand">Tripora<small>WANDER • REMEMBER • RETURN</small></div></div>
 <div class="user-menu" id="topUser"><button class="btn btn-light position-relative" onclick="notify('You are all caught up.')"><i class="bi bi-bell"></i><span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning">1</span></button><div class="avatar" id="topAvatar">ME</div><span class="user-name fw-semibold" id="topName">Maya Ellis</span><button class="btn btn-sm" data-bs-toggle="dropdown"><i class="bi bi-chevron-down"></i></button><ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="#profile">My Profile</a></li><li><a class="dropdown-item" href="#bookings">My Booking</a></li><li><a class="dropdown-item" href="#refunds">My Refund</a></li><li><hr class="dropdown-divider"></li><li><button class="dropdown-item" onclick="showLogout()">Logout</button></li></ul></div>
</header>
<div id="app"></div>
<div class="toast-container position-fixed top-0 end-0 p-3"><div id="toast" class="toast"><div class="toast-header"><strong class="me-auto text-danger">Tripora</strong><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body" id="toastText"></div></div></div>
<div class="modal fade" id="actionModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const imgBali='https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1300&q=85',imgAmalfi='https://images.unsplash.com/photo-1533587851505-d119e13fa0d7?auto=format&fit=crop&w=1300&q=85',imgKyoto='https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1300&q=85';
const seedBookings=[
{id:'WW-260905',name:'Amalfi Coast Days',dest:'Amalfi, Italy',dates:'10–16 Dec 2026',start:'2026-12-10',travellers:2,date:'05 Sep 2026',amount:2400,payment:'Paid',status:'Confirmed',image:imgAmalfi,desc:'Cliffside villages, sunlit terraces and unhurried days by the sea. Your Italian escape, thoughtfully arranged.',transaction:'PAY-260905-0905',lead:'Maya Ellis',companion:'Daniel Ellis',phone:'+44 7700 900123',email:'maya.ellis@example.com'},
{id:'WW-260812',name:'Kyoto Autumn Trail',dest:'Kyoto, Japan',dates:'12–18 Sep 2026',start:'2026-09-12',travellers:2,date:'12 Aug 2026',amount:3240,payment:'Paid',status:'Completed',image:imgKyoto,desc:'Slow mornings, temple paths and the colours of early autumn. A journey worth remembering.',transaction:'PAY-260812-0812',lead:'Maya Ellis',companion:'Daniel Ellis',phone:'+44 7700 900123',email:'maya.ellis@example.com'},
{id:'WW-260515',name:'Lisbon City & Coast',dest:'Lisbon, Portugal',dates:'12–16 Jul 2026',start:'2026-07-12',travellers:2,date:'15 May 2026',amount:1800,payment:'Refunded',status:'Cancelled',image:'https://images.unsplash.com/photo-1555881400-74d7acaacd8b?auto=format&fit=crop&w=1000&q=80',desc:'Coastal charm, colourful streets and a relaxed city escape.',transaction:'PAY-260515-0515'},
{id:'WW-260918',name:'Bali Slow Escape',dest:'Bali, Indonesia',dates:'18–24 Nov 2026',start:'2026-11-18',travellers:2,date:'18 Sep 2026',amount:2880,payment:'Paid',status:'Confirmed',image:imgBali,desc:'Ubud and Seminyak, at your own pace. A restorative island escape.',transaction:'PAY-260918-0918'}
];
const seedRefunds=[
{id:'CN-261028',booking:'WW-260905',name:'Amalfi Coast Days',reason:'Plans changed',date:'28 Oct 2026',amount:2160,method:'Visa •••• 4242',bookingStatus:'Cancelled',status:'Processing',transaction:'— Pending',paid:2400,fee:240,requested:'28 Oct 2026 · 14:32',approved:'28 Oct 2026 · 14:35',processing:'29 Oct 2026 · 09:10'},
{id:'CN-260620',booking:'WW-260515',name:'Lisbon City & Coast',reason:'Schedule conflict',date:'20 Jun 2026',amount:1620,method:'Visa •••• 4242',bookingStatus:'Cancelled',status:'Completed',transaction:'RF-260622-18',paid:1800,fee:180,requested:'20 Jun 2026 · 11:20',approved:'20 Jun 2026 · 11:25',processing:'22 Jun 2026 · 09:00'}
];
let bookings=JSON.parse(localStorage.getItem('tp_bookings')||'null')||seedBookings;
let refunds=JSON.parse(localStorage.getItem('tp_refunds')||'null')||seedRefunds;
let profile=JSON.parse(localStorage.getItem('tp_profile')||'null')||{first:'Maya',last:'Ellis',dob:'14/05/1992',nationality:'British',email:'maya.ellis@example.com',phone:'+44 7700 900123',street:'18 Willow Lane',city:'London',country:'United Kingdom',photo:''};
let currentBooking=bookings[0].id, currentRefund=refunds[0].id, selectedRating=5, uploadedPhoto='';
const save=()=>{localStorage.setItem('tp_bookings',JSON.stringify(bookings));localStorage.setItem('tp_refunds',JSON.stringify(refunds));localStorage.setItem('tp_profile',JSON.stringify(profile));};
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fullName=()=>profile.first+' '+profile.last;
const initials=()=>((profile.first[0]||'M')+(profile.last[0]||'E')).toUpperCase();
function notify(msg){document.getElementById('toastText').textContent=msg;bootstrap.Toast.getOrCreateInstance(document.getElementById('toast')).show()}
function go(route){location.hash=route}
function toggleSidebar(){document.querySelector('.sidebar')?.classList.toggle('open')}
function nav(active){return `<aside class="sidebar"><div class="side-label">MY TRAVEL SPACE</div>
<a class="navlink ${active==='overview'?'active':''}" href="#overview"><i class="bi bi-grid"></i>Overview</a>
<a class="navlink ${active==='bookings'?'active':''}" href="#bookings"><i class="bi bi-suitcase"></i>My Booking</a>
<a class="navlink ${active==='refunds'?'active':''}" href="#refunds"><i class="bi bi-wallet2"></i>My Refund</a>
<a class="navlink ${active==='profile'?'active':''}" href="#profile"><i class="bi bi-person"></i>My Profile</a>
<a class="navlink" href="#" onclick="event.preventDefault();showLogout()"><i class="bi bi-box-arrow-right"></i>Logout</a>
<div class="side-note"><i class="bi bi-compass"></i><strong>A little further, a little closer.</strong><p>Your next story starts here.</p></div></aside>`}
function shell(active,body){document.getElementById('app').innerHTML=`<div class="layout">${nav(active)}<main class="main">${body}<div class="footer-note">Fictional customer · Demonstration data · Tripora</div></main></div>`;document.getElementById('topUser').classList.remove('hide');document.getElementById('topName').textContent=fullName();document.getElementById('topAvatar').innerHTML=profile.photo?`<img src="${profile.photo}">`:initials()}
function heading(kicker,title,sub){return `<div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1><p class="sub">${sub}</p>`}
function stat(label,value,note,icon){return `<div class="stat"><div class="d-flex justify-content-between"><span class="cap">${label}</span><i class="bi ${icon} text-danger"></i></div><strong>${value}</strong><small>${note}</small></div>`}
function render(){
 let route=location.hash.replace('#','')||'overview';if(route==='login'||route==='forgot'){renderLogin(route);return}
 if(!['overview','bookings','booking','cancel','refunds','refund','profile','edit-profile','password'].includes(route))route='overview';
 if(route==='overview')renderOverview();if(route==='bookings')renderBookings();if(route==='booking')renderBooking();if(route==='cancel')renderBooking(true);if(route==='refunds')renderRefunds();if(route==='refund')renderRefund();if(route==='profile')renderProfile();if(route==='edit-profile')renderEditProfile();if(route==='password')renderPassword();
}
function renderOverview(){let next=bookings.find(b=>b.id==='WW-260918')||bookings.find(b=>b.status==='Confirmed');let recent=refunds[0];shell('overview',`${heading('YOUR TRAVEL COMPANION / 01 / OVERVIEW',`Welcome back, ${profile.first}.`,'A new perspective is just around the corner.')}
<div class="stats">${stat('Your journeys',bookings.length,'Every trip, in one place','bi-suitcase')}${stat('Upcoming adventure',bookings.filter(b=>b.status==='Confirmed').length,'Bali is calling','bi-airplane')}${stat('Places explored','1','Memories made in Kyoto','bi-geo-alt')}${stat('Refund in progress',money(refunds.filter(r=>r.status==='Processing').reduce((a,r)=>a+r.amount,0)),'Back to your original card','bi-wallet2')}</div>
<div class="hero"><div class="hero-copy"><span class="pill">Your next adventure · 20 days to go</span><h2>${next?.name||'Your next story awaits'}.</h2><p class="muted">${next?.dates||''} · ${next?.dest||''} · ${next?.travellers||2} travellers</p><div><button class="btn-trip" onclick="openBooking('${next?.id||bookings[0].id}')"><i class="bi bi-arrow-up-right"></i> View Booking Details</button></div></div><img src="${next?.image||imgBali}" alt="Destination"></div>
<div class="grid2"><section class="cardx"><h5>Your account, at a glance</h5><div class="info-pair"><div><small>Travelling as</small><strong>${fullName()}</strong></div><div><small>Member since</small><strong>March 2026</strong></div><div><small>Contact email</small><strong>${profile.email}</strong></div><div><small>Profile complete</small><span class="pill">Profile complete</span></div></div><hr><button class="btn-link-trip" onclick="go('profile')">My Profile →</button></section><section class="cardx"><h5>A few useful shortcuts</h5><div class="d-grid gap-3"><button class="btn-link-trip text-start" onclick="go('bookings')"><i class="bi bi-suitcase me-2"></i>Your travel plans <span class="muted d-block tiny ms-4">Tickets, travellers and trip details</span></button><button class="btn-link-trip text-start" onclick="go('refunds')"><i class="bi bi-wallet2 me-2"></i>Follow your refund <span class="muted d-block tiny ms-4">A clear view of every step</span></button><button class="btn-link-trip text-start" onclick="go('profile')"><i class="bi bi-person me-2"></i>Make it personal <span class="muted d-block tiny ms-4">Keep your information up to date</span></button></div></section></div>
<div class="gridwide"><section class="cardx"><h5>Recent activity</h5><div class="timeline"><div class="step"><small class="muted">29 Oct · 09:10</small><strong class="d-block">Your ${recent?.name||'refund'} refund is ${recent?.status==='Completed'?'complete':'processing'}</strong><span class="muted tiny">${money(recent?.amount||0)} will return to ${recent?.method||'your original card'}.</span></div><div class="step"><small class="muted">28 Oct · 14:32</small><strong class="d-block">Amalfi Coast Days cancelled</strong><span class="muted tiny">Cancellation CN-261028</span></div><div class="step"><small class="muted">18 Sep · 10:42</small><strong class="d-block">Your Bali escape is confirmed</strong><span class="muted tiny">All set for 18 November. Let the countdown begin.</span></div></div></section><section class="cardx"><div class="eyebrow">A LITTLE LOOK BACK</div><img class="booking-cover mb-3" style="height:150px" src="${imgKyoto}"><strong>Kyoto Autumn Trail</strong><div class="muted tiny">12–18 Sep 2026 · ★ 4.92</div><button class="btn-link-trip mt-3" onclick="openBooking('WW-260812')">Share your experience →</button></section></div>`)}
function openBooking(id){currentBooking=id;go('booking')}
function renderBookings(){let rows=bookings.map(b=>`<tr data-status="${b.status}" data-date="${b.start}" data-search="${(b.id+b.name+b.dest).toLowerCase()}"><td><strong>${b.name}</strong><div class="muted tiny">${b.id}</div></td><td>${b.dest}</td><td>${b.dates}</td><td>${b.travellers||2}</td><td>${b.date}</td><td>${money(b.amount)}</td><td><span class="pill ${b.payment==='Refunding'?'warn':''}">${b.payment}</span></td><td><span class="pill ${b.status==='Cancelled'?'red':''}">${b.status}</span></td><td><button class="btn-link-trip" onclick="openBooking('${b.id}')">View Details →</button></td></tr>`).join('');
shell('bookings',`${heading('YOUR TRAVEL COMPANION / 02 / MY BOOKING','Every journey, together.','Your upcoming plans and favourite memories, all in one place.')}
<div class="stats">${stat('All bookings',bookings.length,'Your travel collection','bi-suitcase')}${stat('Upcoming',bookings.filter(b=>b.status==='Confirmed').length,'Bali · 18 November','bi-airplane')}${stat('Completed',bookings.filter(b=>b.status==='Completed').length,'Kyoto · September 2026','bi-geo-alt')}${stat('Cancelled',bookings.filter(b=>b.status==='Cancelled').length,'Refund details available','bi-calendar-x')}</div>
<section class="cardx"><h5>My Bookings</h5><div class="filterbar"><input id="bookingSearch" class="form-control" placeholder="Search ID, package or destination" oninput="filterBookings()"><select id="bookingStatus" class="form-select" onchange="filterBookings()"><option value="">Status: All</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select><select id="bookingDate" class="form-select" onchange="filterBookings()"><option value="">Date: All dates</option><option value="2026">2026</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Package</th><th>Destination</th><th>Start / End</th><th>Travellers</th><th>Booking Date</th><th>Amount</th><th>Payment</th><th>Booking</th><th></th></tr></thead><tbody id="bookingRows">${rows}</tbody></table></div><div class="d-flex justify-content-between flex-wrap gap-2"><small class="muted" id="bookingCount">Showing ${bookings.length} bookings</small><div><button class="btn-outline-trip" onclick="notify('You are on the first page.')">Previous</button> <button class="btn-trip">1</button> <button class="btn-outline-trip" onclick="notify('All demo bookings are displayed.')">Next</button></div></div></section><div class="d-flex justify-content-between mt-4"><strong class="text-danger">Plans changed? We’re here for you.</strong><span class="muted">Open a booking to see cancellation eligibility, trip information or review options.</span></div>`)}

function confirmCancel(id){let b=bookings.find(x=>x.id===id);if(!b||b.status!=='Confirmed'){notify('This booking cannot be cancelled.');return}let reason=document.getElementById('cancelReason').value,fee=Math.round(b.amount*.1*100)/100; b.status='Cancelled';b.payment='Refunding';refunds.unshift({id:'CN-'+Date.now().toString().slice(-6),booking:id,name:b.name,reason,date:'08 Nov 2026',amount:b.amount-fee,method:'Visa •••• 4242',bookingStatus:'Cancelled',status:'Processing',transaction:'— Pending',paid:b.amount,fee,requested:'08 Nov 2026 · 09:10',approved:'08 Nov 2026 · 09:15',processing:'08 Nov 2026 · 09:20'});save();bootstrap.Modal.getInstance(document.getElementById('actionModal')).hide();currentRefund=refunds[0].id;notify('Booking cancelled. Your refund request has been created.');go('refund')}

function saveProfile(e){e.preventDefault();let f=new FormData(e.target);profile={...profile,first:f.get('first').trim(),last:f.get('last').trim(),dob:f.get('dob'),nationality:f.get('nationality'),email:f.get('email').trim(),phone:f.get('phone').trim(),street:f.get('street'),city:f.get('city'),country:f.get('country')};if(!/^[^@]+@[^@]+\.[^@]+$/.test(profile.email)){notify('Please enter a valid email address.');return}save();notify('Your information has been saved.');go('profile')}

hone.</p><strong class="text-danger">Current state: ready to update.</strong></section></div>`)}
function passwordStrength(){let p=document.getElementById('newPass').value,score=[p.length>=12,/[A-Z]/.test(p)&&/[a-z]/.test(p),/[0-9]/.test(p),/[^A-Za-z0-9]/.test(p)].filter(Boolean).length;document.getElementById('passBar').style.width=(score*25)+'%';document.getElementById('passHint').textContent=score===4?'Strong password':`Password strength: ${score}/4 requirements met`}
function changePassword(e){e.preventDefault();let p=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value;if(p.length<12||!/[A-Z]/.test(p)||!/[a-z]/.test(p)||!/[0-9]/.test(p)||!/[^A-Za-z0-9]/.test(p)){notify('Password must meet all four strength requirements.');return}if(p!==c){notify('New password and confirmation do not match.');return}if(p===document.getElementById('currentPass').value){notify('Choose a new password different from your current one.');return}localStorage.setItem('tp_demo_password',p);notify('Password updated successfully (demo only).');go('profile')}
function togglePass(id){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}
function showLogout(){modal(`<div class="modal-body text-center py-4"><div class="avatar mx-auto mb-3" style="width:55px;height:55px"><i class="bi bi-box-arrow-right fs-4"></i></div><h4 class="modal-title">Log out of your account?</h4><p class="muted mt-2">Your plans and favourite memories will be right here when you return.</p><div class="d-flex justify-content-center gap-2 mt-4"><button class="btn-outline-trip" data-bs-dismiss="modal">Stay Logged In</button><button class="btn-trip" onclick="logout()">Confirm Logout</button></div><small class="muted d-block mt-3">Confirm Logout takes you to the Tripora login page.</small></div>`)}
function logout(){bootstrap.Modal.getInstance(document.getElementById('actionModal')).hide();go('login')}
function renderLogin(route){document.getElementById('topUser').classList.add('hide');document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-photo"><div class="quote"><small>WANDER SLOWLY. REMEMBER DEEPLY.</small><h2>The world is waiting. Your journey is here.</h2><p>One welcoming place for your travel plans, favourite memories and everything in between.</p><small><i class="bi bi-geo-alt"></i> Ubud, Bali · Find your own pace</small></div></div><div class="login-form"><div class="login-form-inner"><div class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</div><h1 class="page-title">${route==='forgot'?'Reset your password':'Welcome back.'}</h1><p class="sub">${route==='forgot'?'Enter your email and we’ll show a demo reset confirmation.':'Log in to your personal Tripora account.'}</p><form onsubmit="${route==='forgot'?'forgotPassword(event)':'login(event)'}"><label class="form-label">Email address</label><input required type="email" class="form-control mb-3" id="loginEmail" value="${profile.email}">${route==='login'?`<label class="form-label">Password</label><div class="input-group mb-3"><input required type="password" class="form-control" id="loginPassword" value="TriporaDemo123!"><button type="button" class="btn-outline-trip" onclick="togglePass('loginPassword')"><i class="bi bi-eye"></i></button></div><div class="d-flex justify-content-between mb-3"><label><input type="checkbox" checked> Remember me</label><a class="btn-link-trip" href="#forgot">Forgot password?</a></div>`:''}<button class="btn-trip w-100">${route==='forgot'?'Send Reset Instructions':'→　Log In'}</button></form><div class="alert-soft mt-4 tiny"><strong>A little help along the way?</strong><br>hello@tripora.example · We’re here for you.</div><p class="muted tiny mt-4"><i class="bi bi-lock"></i> A secure space for your travel plans and personal details.</p></div></div></div>`}
function login(e){e.preventDefault();let email=document.getElementById('loginEmail').value;if(email.toLowerCase()!==profile.email.toLowerCase()){notify('Demo login: use the email saved in My Profile.');return}notify('Welcome back to Tripora!');go('overview')}
function forgotPassword(e){e.preventDefault();notify('If this were a live account, reset instructions would be sent to your email.');go('login')}
function modal(content){document.getElementById('modalBody').innerHTML=content;bootstrap.Modal.getOrCreateInstance(document.getElementById('actionModal')).show()}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);
</script>
